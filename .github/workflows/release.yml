name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v, for example 1.1.0
        required: true
        type: string
      build_number:
        description: Positive CFBundleVersion
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MONTAZHKA_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      NOTARY_KEYCHAIN_PROFILE: montazhka-ci
      # Параметры запуска доходят до оболочки только переменными: в тексте команд их нет.
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # До любых секретов: неверные значения не доходят до сертификата и нотаризации.
      - name: Validate release inputs
        run: ./scripts/validate-release-inputs.sh

      - name: Prepare release environment
        run: echo "NOTARY_KEYCHAIN_PATH=$RUNNER_TEMP/montazhka-release.keychain-db" >> "$GITHUB_ENV"

      - name: Select Xcode
        # На образе macos-26 Xcode по умолчанию — 26.6, тот же, что в CI.
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install pinned tools
        run: ./scripts/bootstrap-tools.sh

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$certificate_path"' EXIT
          keychain_path="$NOTARY_KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          trap 'rm -f "$key_path"' EXIT
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$key_path"
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" \
            --keychain "$NOTARY_KEYCHAIN_PATH" \
            --key "$key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"

      - name: Build, sign and notarize
        run: ./scripts/release.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            build.noindex/release/*.zip \
            build.noindex/release/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Монтажка v$RELEASE_VERSION" \
            --generate-notes

      # Ключи и временная связка удаляются при любом исходе.
      - name: Remove credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          if [ -n "${NOTARY_KEYCHAIN_PATH:-}" ] && [ -f "$NOTARY_KEYCHAIN_PATH" ]; then
            security delete-keychain "$NOTARY_KEYCHAIN_PATH" || true
          fi
