included:
  - Sources
  - Tests

excluded:
  - .build
  - build.noindex

only_rules:
  - duplicate_imports
  - empty_count
  - empty_string
  - file_length
  - force_cast
  - function_body_length
  - identifier_name
  - legacy_constructor
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length

file_length:
  warning: 1200

type_body_length:
  warning: 1000

function_body_length:
  warning: 180

identifier_name:
  min_length: 1
  excluded:
    - id
    - x
    - y
    - q
    - ch
